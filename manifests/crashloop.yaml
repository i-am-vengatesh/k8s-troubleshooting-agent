apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-app
  namespace: agent-test
spec:
  replicas: 1
  selector:
    matchLabels: {app: crashloop-app}
  template:
    metadata:
      labels: {app: crashloop-app}
    spec:
      containers:
      - name: app
        image: busybox
        command: ["sh", "-c", "echo 'Application starting...'; echo 'ERROR: Database connection failed'; echo 'Application exiting...'; exit 1"]
